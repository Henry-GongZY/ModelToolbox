[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "modeltoolbox"
version = "0.2.0"
description = "Local-first model structure diff workbench: ONNX graph diff, PyTorch module browsing, profile heatmaps"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Henry-GongZY" }]
keywords = ["onnx", "netron", "model-diff", "graph-visualization", "deep-learning", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Debuggers",
]
dependencies = ["onnx>=1.15", "numpy", "netron>=9.3.5,<10"]

[project.optional-dependencies]
torch = ["torch"]
dev = ["pytest", "build", "twine"]

[project.urls]
Homepage = "https://github.com/Henry-GongZY/ModelToolbox"
Issues = "https://github.com/Henry-GongZY/ModelToolbox/issues"

[project.scripts]
modeltoolbox = "modeltoolbox.server:main"

[tool.setuptools]
package-dir = { "" = "backend" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
modeltoolbox = ["frontend/**/*", "frontend/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
